name: Test TALPA Golden1000 controlled pool

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build controlled feed
        env:
          ZAINSTRUMENTOM_FEED_URL: ${{ secrets.ZAINSTRUMENTOM_FEED_URL }}
          TEKNOSEL_FEED_URL: ${{ secrets.TEKNOSEL_FEED_URL }}
          GRANDINSTRUMENT_FEED_URL: ${{ secrets.GRANDINSTRUMENT_FEED_URL }}
          GPL_FEED_URL: ${{ secrets.GPL_FEED_URL }}
          SIGMA_FEED_URL: https://sigma.ua/bitrix/catalog_export/marketsigma_all_ua.php
          PUBLISHED_FEED_URL: https://yuriimitiaiev-coder.github.io/talpa-golden1000-feed-prod/golden1000.xml
          GOLDEN980_MODE: "1"
          GOLDEN980_RRP_AUDIT: "1"
          MAX_CAPACITY: "1000"
          MAX_MISSING_ACTIVE: "25"
          DOWNLOAD_TIMEOUT_SECONDS: "120"
        run: python scripts/build_pool_feed.py

      - name: Validate approved Golden980 output
        run: GRAND35_STAGING=1 GOLDEN980_MODE=1 python scripts/validate_golden980_output.py

      - name: Unit-test supplier RRP policy
        run: python -m unittest discover -s tests -p test_golden980_price_policy.py -v
