name: Test SIGMA 424 migration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build test feed
        env:
          SOURCE_FEED_URL: ${{ secrets.SOURCE_FEED_URL }}
          ZAINSTRUMENTOM_FEED_URL: ${{ secrets.ZAINSTRUMENTOM_FEED_URL }}
          SIGMA_FEED_URL: https://sigma.ua/bitrix/catalog_export/marketsigma_ua.php
          EXPECTED_COUNT: "1000"
          DOWNLOAD_TIMEOUT_SECONDS: "120"
        run: python scripts/filter_feed_sigma_overlay.py

      - name: Validate migration safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          status = json.loads(Path('docs/status.json').read_text(encoding='utf-8'))
          wanted_codes = {
              line.strip()
              for line in Path('golden_codes.txt').read_text(encoding='utf-8').splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          }

          assert status['offers'] == len(wanted_codes), status
          assert status['sigma_assigned'] == 406, status
          assert status['sigma_overlaid'] == 406, status
          assert len(status['sigma_missing']) == 0, status
          assert status['zainstrumentom_assigned'] == 11, status

          root = etree.parse('docs/golden1000.xml').getroot()
          offers = root.find('shop').find('offers').findall('offer')
          codes = [(o.findtext('vendorCode') or '').strip() for o in offers]

          assert len(codes) == len(wanted_codes)
          assert len(set(codes)) == len(codes)
          assert set(codes) == wanted_codes

          # Critical control SKU: existing TALPA code must remain unchanged.
          assert '779535' in codes

          print(json.dumps(status, ensure_ascii=False, indent=2))
          print(f'Validated {len(codes)} unique Golden SKUs against golden_codes.txt')
          PY
