name: Stage5 raw SIGMA exact SKU probe

on:
  workflow_dispatch:
  push:
    branches: [stage5-supply-resolver]
    paths:
      - ".github/workflows/stage5-sigma-raw-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download current SIGMA XML and exact-match SKUs
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 120             "https://sigma.ua/bitrix/catalog_export/marketsigma_ua.php" -o sigma.xml
          echo "SIGMA_XML_BYTES=$(wc -c < sigma.xml)"
          for sku in 1303311 1719691; do
            if grep -Fq "$sku" sigma.xml; then
              echo "RAW_SIGMA_PROBE|sku=$sku|present=true"
              grep -Fo ".\{0,160\}$sku.\{0,300\}" sigma.xml | head -n 3 || true
            else
              echo "RAW_SIGMA_PROBE|sku=$sku|present=false"
            fi
          done
