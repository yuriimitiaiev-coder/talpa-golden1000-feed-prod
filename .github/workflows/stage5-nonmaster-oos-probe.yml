name: Stage5 exact non-MASTER OOS probe

on:
  workflow_dispatch:
  push:
    branches: [stage5-supply-resolver]
    paths:
      - ".github/workflows/stage5-nonmaster-oos-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Exact current-feed probe
        env:
          ZAINSTRUMENTOM_FEED_URL: ${{ secrets.ZAINSTRUMENTOM_FEED_URL }}
          TEKNOSEL_FEED_URL: ${{ secrets.TEKNOSEL_FEED_URL }}
          GRANDINSTRUMENT_FEED_URL: ${{ secrets.GRANDINSTRUMENT_FEED_URL }}
          GPL_FEED_URL: ${{ secrets.GPL_FEED_URL }}
          SIGMA_FEED_URL: https://sigma.ua/bitrix/catalog_export/marketsigma_ua.php
          DOWNLOAD_TIMEOUT_SECONDS: "120"
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          from pool_common import (
              SIGMA_URL, ZA_URL, GRAND_URL, TEKNOSEL_URL, GPL_URL,
              download, supplier_offer_map, google_merchant_offer_map, gpl_offer_map,
          )
          targets=["9783836","7013611","4332451","10109_M1","11223","1103-2427","1103-2017","1103-2430","19912","1101-2464","1004-0062","1207-0890","40099","4220801","1028630","1001-0033","1513151","9794220","1104-2419","1001-0144","3715251","1101-1701","14150","3715151","8314225","90155"]
          maps = {
              "SIGMA": supplier_offer_map(download(SIGMA_URL, "SIGMA"), "SIGMA"),
              "ZAINSTRUMENTOM": supplier_offer_map(download(ZA_URL, "Zainstrumentom"), "Zainstrumentom"),
              "GRANDINSTRUMENT": supplier_offer_map(download(GRAND_URL, "Grand Instrument"), "Grand Instrument"),
              "TEKNOSEL": google_merchant_offer_map(download(TEKNOSEL_URL, "TEKNOSEL"), "TEKNOSEL"),
              "GPL": gpl_offer_map(download(GPL_URL, "GPL"), "GPL"),
          }
          print("NONMASTER_OOS_PROBE_BEGIN")
          for sku in targets:
              hits=[]
              for partner, mp in maps.items():
                  offer=mp.get(sku)
                  if offer is None: continue
                  name=(offer.findtext("name_ua") or offer.findtext("name") or "").strip()
                  qty=(offer.findtext("quantity_in_stock") or "").strip()
                  price=(offer.findtext("price") or "").strip()
                  hits.append((partner,offer.get("available"),qty,price,name))
              if not hits:
                  print(f"NONMASTER_OOS|sku={sku}|status=MISSING_ALL_FEEDS")
              else:
                  avail=[h for h in hits if h[1]=="true"]
                  status="LIVE_NOW" if avail else "STILL_OOS"
                  for partner,available,qty,price,name in hits:
                      print(f"NONMASTER_OOS|sku={sku}|status={status}|partner={partner}|available={available}|qty={qty}|price={price}|name={name}")
          print("NONMASTER_OOS_PROBE_END")
          PY
