# Production republish trigger after TEKNOSEL validation 2026-08-22
name: Build and publish TALPA Golden1000 controlled pool

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pool/**"
      - "groups/**"
      - "scripts/**"
      - "sources/**"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: talpa-golden1000-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build controlled feed
        env:
          ZAINSTRUMENTOM_FEED_URL: ${{ secrets.ZAINSTRUMENTOM_FEED_URL }}
          TEKNOSEL_FEED_URL: ${{ secrets.TEKNOSEL_FEED_URL }}
          GRANDINSTRUMENT_FEED_URL: ${{ secrets.GRANDINSTRUMENT_FEED_URL }}
          GPL_FEED_URL: ${{ secrets.GPL_FEED_URL }}
          SIGMA_FEED_URL: https://sigma.ua/bitrix/catalog_export/marketsigma_all_ua.php
          PUBLISHED_FEED_URL: https://yuriimitiaiev-coder.github.io/talpa-golden1000-feed-prod/golden1000.xml
          MAX_CAPACITY: "1000"
          MAX_MISSING_ACTIVE: "25"
          DOWNLOAD_TIMEOUT_SECONDS: "120"
        run: python scripts/build_pool_feed.py

      - name: Validate generated output
        run: |
          test -s docs/golden1000.xml
          test -s docs/status.json
          test -s docs/kit_price_snapshot.json
          test -s docs/kit_supply_resolver.json
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          from lxml import etree

          sys.path.insert(0, str(Path("scripts").resolve()))
          from pool_common import load_pool

          status = json.loads(Path("docs/status.json").read_text(encoding="utf-8"))
          snapshot = json.loads(Path("docs/kit_price_snapshot.json").read_text(encoding="utf-8"))
          resolver = json.loads(Path("docs/kit_supply_resolver.json").read_text(encoding="utf-8"))
          pool = load_pool()
          active = [r for r in pool if r["status"] == "ACTIVE"]

          assert 1 <= len(active) <= 1000, len(active)
          assert len(pool) <= 1000, len(pool)
          assert status["offers"] == len(active), status
          assert status["active"] == len(active), status
          assert status["pool_configured"] == len(pool), status
          assert status["free_slots"] == 1000 - len(pool), status
          assert len(status["sha256"]) == 64, status
          assert status["supplier_missing_count"] <= 25, status

          root = etree.parse("docs/golden1000.xml").getroot()
          offers = root.find("shop").find("offers").findall("offer")
          codes = [(o.findtext("vendorCode") or "").strip() for o in offers]
          expected = [r["sku"] for r in active]
          assert codes == expected
          assert len(set(codes)) == len(codes)
          assert len({(o.get("id") or "").strip() for o in offers}) == len(offers)

          # Controlled catalogue rotation 19.09.2026:
          # promote exact MASTER PLWP0110, demote redundant AQUATICA 9784281,
          # and retire old RESERVE 9784284 while preserving 980/20/1000.
          assert status["active"] == 980, status
          assert status["reserve_configured"] == 20, status
          assert status["pool_configured"] == 1000, status
          assert "PLWP0110" in codes, codes
          assert "9784281" not in codes, codes
          assert all(r["sku"] != "9784281" for r in pool), pool
          assert all(r["sku"] != "9784284" for r in pool), pool

          # Commercial-only rotation 02.10.2026:
          # replace unavailable 3912021 / 6021781 with top-ranked live SIGMA
          # candidates 8217182 / 4010502. Retire legacy RESERVE 9784290 / 9784297.
          assert status["active"] == 980, status
          assert status["reserve_configured"] == 20, status
          assert status["pool_configured"] == 1000, status
          by_code = {(o.findtext("vendorCode") or "").strip(): o for o in offers}
          for sku in {"8217182", "4010502"}:
              assert sku in codes, (sku, codes)
              assert sku not in status["supplier_missing_active"], status
              assert by_code[sku].get("available") == "true", etree.tostring(by_code[sku], encoding="unicode")
              assert int(float((by_code[sku].findtext("quantity_in_stock") or "0").replace(",", "."))) > 0, etree.tostring(by_code[sku], encoding="unicode")
          for sku in {"3912021", "6021781"}:
              assert sku not in codes, (sku, codes)
              assert all(r["sku"] != sku for r in pool), (sku, pool)
          for retired in {"9784290", "9784297"}:
              assert all(r["sku"] != retired for r in pool), (retired, pool)


          # SIGMA media mirror 03.10.2026:
          # every ACTIVE SIGMA offer must use exactly one TALPA Pages image.
          sigma_active = [r["sku"] for r in active if r["supplier"] == "SIGMA"]
          hosted_prefix = "https://yuriimitiaiev-coder.github.io/talpa-golden1000-feed-prod/media/sigma/"
          assert status["sigma_active"] == len(sigma_active), status
          assert status["sigma_media_repaired_count"] == len(sigma_active), status
          assert status["sigma_media_mirrored_skus"] == len(sigma_active), status
          assert status["sigma_media_mirrored_files"] == len(sigma_active), status
          assert set(status["sigma_media_repaired_skus"]) == set(sigma_active), status
          for sku in sigma_active:
              pictures = [(p.text or "").strip() for p in by_code[sku].findall("picture")]
              assert len(pictures) == 1, (sku, pictures)
              picture_url = pictures[0]
              assert picture_url.startswith(hosted_prefix), (sku, picture_url)
              assert "sigma.ua/" not in picture_url, (sku, picture_url)
              rel = picture_url.split("/talpa-golden1000-feed-prod/", 1)[1]
              media_file = Path("docs") / rel
              assert media_file.is_file(), (sku, picture_url, media_file)
              assert media_file.stat().st_size >= 500, (sku, picture_url, media_file.stat().st_size)

          # Commercial rotation wave 1 — 03.10.2026:
          # 20 unavailable ZaInstrumentom SKUs -> ranked candidates #3-22.
          wave1_new = {
              "8402521", "4002121", "4001141", "6010111", "4009021",
              "6003055", "4008531", "9449701", "8217172", "3822142",
              "4013202", "2613631", "9026121", "8429611", "9029025",
              "9038125", "1520081", "9410911", "4002912", "4004011",
          }
          wave1_old = {
              "1103-0722", "3004-0332", "1101-0224", "1102-0193", "1008-0059",
              "31482", "1239250G5", "YT-82055", "YT-827722", "YT-82786", "YT-828461",
          }
          wave1_retired_reserve = {
              "9680505", "9681105", "9681405", "9687905", "1001-1882",
              "1103-0030", "1103-2531", "1109-0869", "1207-2061", "9780210",
              "ZTE150", "7012091", "2722022", "1001-1891", "1109-0882",
              "295", "PLSC0108", "9784281", "3912021", "6021781",
              "FD775-30", "605", "1107-0865", "1001-2434", "1001-2605",
              "30105", "1101-0200", "1008-0331", "FD-793",
          }
          assert status["active"] == 980, status
          assert status["reserve_configured"] == 20, status
          assert status["pool_configured"] == 1000, status
          by_code = {(o.findtext("vendorCode") or "").strip(): o for o in offers}
          for sku in wave1_new:
              assert sku in codes, (sku, codes)
              assert sku not in status["supplier_missing_active"], status
              assert by_code[sku].get("available") == "true", etree.tostring(by_code[sku], encoding="unicode")
              assert int(float((by_code[sku].findtext("quantity_in_stock") or "0").replace(",", "."))) > 0, etree.tostring(by_code[sku], encoding="unicode")
          for sku in wave1_old:
              assert sku not in codes, (sku, codes)
              assert any(r["sku"] == sku and r["status"] == "RESERVE" for r in pool), (sku, pool)
          for sku in wave1_retired_reserve:
              assert all(r["sku"] != sku for r in pool), (sku, pool)

          # Commercial rotation wave 2 — 03.10.2026:
          # 9 remaining unavailable SIGMA SKUs -> next unused ranked candidates.
          wave2_new = {
              "4408621", "4102751", "4326231", "5045594", "4409711",
              "9418541", "4328411", "1640061", "1640041",
          }
          wave2_old = {
              "7012281", "4375431", "9783822", "4322071", "4016712",
              "6003075", "9443481", "6003132", "9445411",
          }
          wave2_retired_reserve = {
              "FD775-30", "605", "1107-0865", "1001-2434", "1001-2605",
              "30105", "1101-0200", "1008-0331", "FD-793",
          }
          assert status["active"] == 980, status
          assert status["reserve_configured"] == 20, status
          assert status["pool_configured"] == 1000, status
          by_code = {(o.findtext("vendorCode") or "").strip(): o for o in offers}
          for sku in wave2_new:
              assert sku in codes, (sku, codes)
              assert sku not in status["supplier_missing_active"], status
              assert by_code[sku].get("available") == "true", etree.tostring(by_code[sku], encoding="unicode")
              assert int(float((by_code[sku].findtext("quantity_in_stock") or "0").replace(",", "."))) > 0, etree.tostring(by_code[sku], encoding="unicode")
              assert by_code[sku].findall("picture"), etree.tostring(by_code[sku], encoding="unicode")
          for sku in wave2_old:
              assert sku not in codes, (sku, codes)
              assert any(r["sku"] == sku and r["status"] == "RESERVE" for r in pool), (sku, pool)
          for sku in wave2_retired_reserve:
              assert all(r["sku"] != sku for r in pool), (sku, pool)
          assert status["supplier_missing_count"] == 0, status

          assert snapshot["schema_version"] == 1, snapshot
          assert snapshot["source_master"] == "TALPA_KIT_MASTER_FINAL_v1_0", snapshot
          assert snapshot["configured_sku_count"] == 99, snapshot
          assert len(snapshot["items"]) == 99, snapshot
          assert snapshot["counts_by_partner"] == {
              "GRANDINSTRUMENT": 36,
              "SIGMA": 37,
              "ZAINSTRUMENTOM": 26,
          }, snapshot
          snapshot_keys = [
              (item["partner"], item["sku"])
              for item in snapshot["items"]
          ]
          assert len(set(snapshot_keys)) == 99, snapshot_keys
          assert snapshot["found_count"] + snapshot["missing_count"] == 99, snapshot

          assert resolver["schema_version"] == 1, resolver
          assert resolver["source_master"] == "TALPA_KIT_MASTER_FINAL_v1_0", resolver
          assert resolver["source_substitution_registry"] == "master_live_substitutes.csv", resolver
          assert resolver["policy"] == "APPROVED_SUPPLIERS_ONLY", resolver
          assert resolver["approved_suppliers"] == ["GRANDINSTRUMENT", "SIGMA", "ZAINSTRUMENTOM"], resolver
          assert resolver["configured_sku_count"] == 99, resolver
          assert len(resolver["items"]) == 99, resolver
          assert sum(resolver["decision_counts"].values()) == 99, resolver
          assert sum(resolver["line_action_counts"].values()) == 99, resolver
          assert resolver["quoteable_count"] + resolver["blocked_count"] == 99, resolver

          allowed_decisions = {"PRIMARY_OK", "SUBSTITUTE", "COMPOSITE", "HOLD"}
          allowed_actions = {
              "KEEP_PRIMARY",
              "REPLACE_1_TO_1",
              "REPLACE_COMPOSITE",
              "REQUIRE_EXISTING_COVERAGE",
              "BLOCK",
          }
          resolver_skus = []
          for item in resolver["items"]:
              assert item["decision"] in allowed_decisions, item
              assert item["line_action"] in allowed_actions, item
              resolver_skus.append(item["primary_sku"])
              for resolved in item["resolved_items"]:
                  partner = resolved.get("partner") or ""
                  if partner:
                      assert partner in resolver["approved_suppliers"], resolved
                  if resolved["quoteable"]:
                      assert resolved.get("name"), resolved
              if item["can_quote"]:
                  assert item["decision"] != "HOLD", item
                  assert item["line_action"] != "BLOCK", item
                  assert item["resolved_items"], item
                  assert all(r["quoteable"] for r in item["resolved_items"]), item
              else:
                  assert item["decision"] == "HOLD", item
                  assert item["line_action"] == "BLOCK", item
          assert len(set(resolver_skus)) == 99, resolver_skus

          # Frozen FINAL v1.0 integrity checks.
          # Operational substitutions must never rewrite the 99 PRIMARY MASTER set.
          final_primary = set(resolver_skus)
          for sku in {"EHF0500", "8316755", "50478", "20039", "9419111", "9419311", "1109-0872"}:
              assert sku in final_primary, (sku, final_primary)
          for operational_only in {"4316051", "20101", "1105-0349", "RM 418 1800"}:
              assert operational_only not in final_primary, (operational_only, final_primary)

          # Remaining unresolved drill is still fail-closed.
          drill = next(item for item in resolver["items"] if item["primary_sku"] == "YT-82786")
          assert drill["decision"] == "HOLD", drill
          assert drill["line_action"] == "BLOCK", drill
          assert drill["can_quote"] is False, drill

          hacksaw = next(item for item in resolver["items"] if item["primary_sku"] == "HSP0300")
          assert hacksaw["can_quote"] is True, hacksaw

          print(json.dumps(status, ensure_ascii=False, indent=2))
          print(json.dumps({
              "kit_price_snapshot": {
                  "configured_sku_count": snapshot["configured_sku_count"],
                  "found_count": snapshot["found_count"],
                  "missing_count": snapshot["missing_count"],
                  "available_count": snapshot["available_count"],
                  "found_by_partner": snapshot["found_by_partner"],
              },
              "kit_supply_resolver": {
                  "configured_sku_count": resolver["configured_sku_count"],
                  "quoteable_count": resolver["quoteable_count"],
                  "blocked_count": resolver["blocked_count"],
                  "decision_counts": resolver["decision_counts"],
                  "line_action_counts": resolver["line_action_counts"],
              },
          }, ensure_ascii=False, indent=2))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
