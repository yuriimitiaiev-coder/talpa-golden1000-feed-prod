# Production republish trigger after TEKNOSEL validation 2026-08-22
name: Build and publish TALPA Golden1000 controlled pool

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "pool/**"
      - "groups/**"
      - "scripts/**"
      - "sources/**"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: talpa-golden1000-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build controlled feed
        env:
          ZAINSTRUMENTOM_FEED_URL: ${{ secrets.ZAINSTRUMENTOM_FEED_URL }}
          TEKNOSEL_FEED_URL: ${{ secrets.TEKNOSEL_FEED_URL }}
          GRANDINSTRUMENT_FEED_URL: ${{ secrets.GRANDINSTRUMENT_FEED_URL }}
          GPL_FEED_URL: ${{ secrets.GPL_FEED_URL }}
          SIGMA_FEED_URL: https://sigma.ua/bitrix/catalog_export/marketsigma_all_ua.php
          PUBLISHED_FEED_URL: https://yuriimitiaiev-coder.github.io/talpa-golden1000-feed-prod/golden1000.xml
          GOLDEN980_MODE: "1"
          MAX_CAPACITY: "1000"
          MAX_MISSING_ACTIVE: "25"
          DOWNLOAD_TIMEOUT_SECONDS: "120"
        run: python scripts/build_pool_feed.py

      - name: Validate generated output
        run: |
          test -s docs/golden1000.xml
          test -s docs/status.json
          test -s docs/stock_monitor.json
          test -s docs/stock.html
          test -s docs/kit_price_snapshot.json
          test -s docs/kit_supply_resolver.json
          test -s docs/sources/sigma_feed.xml.gz
          GOLDEN980_MODE=1 python scripts/validate_golden980_output.py

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  health_signal:
    if: always() && github.event_name != 'pull_request'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ALERT_TITLE: "[Golden1000 ALERT] Production feed update failed"
      RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    steps:
      - name: Open or clear Golden1000 health alert
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(gh issue list --repo "$GH_REPO" --state open --search "$ALERT_TITLE in:title" --json number,title --jq '.[] | select(.title == env.ALERT_TITLE) | .number' | head -n1)"
          if [[ "${{ needs.build.result }}" == "success" && "${{ needs.deploy.result }}" == "success" ]]; then
            if [[ -n "$issue_number" ]]; then
              gh issue comment "$issue_number" --repo "$GH_REPO" --body "Golden1000 recovered successfully. Build and deploy are PASS. Run: $RUN_URL"
              gh issue close "$issue_number" --repo "$GH_REPO"
            fi
          else
            body="Golden1000 production update failed. Build=${{ needs.build.result }}, deploy=${{ needs.deploy.result }}. The previously published feed may now be stale. Run: $RUN_URL"
            if [[ -z "$issue_number" ]]; then
              gh issue create --repo "$GH_REPO" --title "$ALERT_TITLE" --body "$body"
            fi
          fi
